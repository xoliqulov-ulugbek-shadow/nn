<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>MegaMusic</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23222' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M12 8v12a3 3 0 1 0 2 3V12h6V8z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" style="stop-color:var(--l1)" />
                <stop offset="1" style="stop-color:var(--l2)" />
            </linearGradient>
            <symbol id="i-logo" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="19" fill="url(#lg)" />
                <path d="M15 10v15.5a4 4 0 1 0 3 3.8V16h8v-6z" style="fill:var(--bg)" />
                <path d="M4 20h3M33 20h3M8 14v12M32 14v12" style="stroke:var(--bg)" stroke-width="2"
                    stroke-linecap="round" opacity=".5" />
            </symbol>
            <symbol id="i-play" viewBox="0 0 24 24">
                <path d="M7 4.5v15l13-7.5z" />
            </symbol>
            <symbol id="i-pause" viewBox="0 0 24 24">
                <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
            </symbol>
            <symbol id="i-next" viewBox="0 0 24 24">
                <path d="M6 5l10 7-10 7zM17 5h2v14h-2z" />
            </symbol>
            <symbol id="i-prev" viewBox="0 0 24 24">
                <path d="M18 5L8 12l10 7zM5 5h2v14H5z" />
            </symbol>
            <symbol id="i-heart" viewBox="0 0 24 24">
                <path d="M12 21s-8-5.3-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.7 12 21 12 21z" />
            </symbol>
            <symbol id="i-x" viewBox="0 0 24 24">
                <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    fill="none" />
            </symbol>
            <symbol id="i-search" viewBox="0 0 24 24">
                <circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="2.2" fill="none" />
                <path d="M15 15l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            </symbol>
            <symbol id="i-home" viewBox="0 0 24 24">
                <path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z" />
            </symbol>
            <symbol id="i-clock" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2" fill="none" />
                <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    fill="none" />
            </symbol>
            <symbol id="i-vol" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 4V5L7 9zM16 8a5 5 0 0 1 0 8" stroke="currentColor" stroke-width="2" fill="none" />
            </symbol>
            <symbol id="i-b10" viewBox="0 0 24 24">
                <path d="M12 5a8 8 0 1 1-8 8" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M12 1L7 5l5 4z" /><text x="8" y="16" font-size="7" font-weight="700"
                    fill="currentColor">10</text>
            </symbol>
            <symbol id="i-f10" viewBox="0 0 24 24">
                <path d="M12 5a8 8 0 1 0 8 8" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M12 1l5 4-5 4z" /><text x="8" y="16" font-size="7" font-weight="700"
                    fill="currentColor">10</text>
            </symbol>
            <symbol id="i-repeat" viewBox="0 0 24 24">
                <path d="M17 2l4 4-4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                <path d="M7 22l-4-4 4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            </symbol>
            <symbol id="i-list" viewBox="0 0 24 24">
                <path d="M3 6h14M3 12h14M3 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                <path d="M19 15v6M16 18h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            </symbol>
            <symbol id="i-plus" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
            </symbol>
            <symbol id="i-share" viewBox="0 0 24 24">
                <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2" fill="none"/>
            </symbol>
            <symbol id="i-cam" viewBox="0 0 24 24">
                <path d="M4 8h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="12" cy="14" r="3.5" stroke="currentColor" stroke-width="2" fill="none"/>
            </symbol>
            <symbol id="i-down" viewBox="0 0 24 24">
                <path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none" />
            </symbol>
            <symbol id="i-up" viewBox="0 0 24 24">
                <path d="M5 15l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none" />
            </symbol>
            <symbol id="i-moon" viewBox="0 0 24 24">
                <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" />
            </symbol>
            <symbol id="i-user" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21a8 8 0 0 1 16 0z" />
            </symbol>
            <symbol id="i-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4.5" />
                <path d="M12 1v3M12 20v3M1 12h3M20 12h3M4 4l2 2M18 18l2 2M4 20l2-2M18 6l2-2" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" />
            </symbol>
        </defs>
    </svg>

    <div id="auth">
        <div class="box">
            <div class="logo big"><svg>
                    <use href="#i-logo" />
                </svg><span>MegaMusic</span></div>
            <div class="lang-bar auth-lang">
                <button data-gl="uz">UZ</button>
                <button data-gl="en">EN</button>
                <button data-gl="ru">RU</button>
            </div>
            <div class="tabs"><button class="on" data-t="login" data-i="login">Kirish</button><button data-t="reg"
                    data-i="reg">Ro'yxatdan o'tish</button></div>
            <form id="fl"><input id="ln" data-p="nick" autocomplete="username"><input id="lp" type="password"
                    data-p="pass" autocomplete="current-password"><button class="btn" data-i="login">Kirish</button>
            </form>
            <form id="fr" hidden><input id="re" type="email" placeholder="Gmail (example@gmail.com)"><input id="rn"
                    data-p="nick" autocomplete="username"><input id="rp" type="password" data-p="pass8"
                    autocomplete="new-password">
                <div class="meter"><i id="mb"></i></div><small id="ml"></small><button class="btn"
                    data-i="reg">Ro'yxatdan o'tish</button>
            </form>
            <p id="am" class="msg"></p>
        </div>
    </div>

    <div id="app" hidden>
        <aside>
            <div class="logo"><svg>
                    <use href="#i-logo" />
                </svg><span>MegaMusic</span></div>
            <button class="prof" data-v="profile"><span class="av" id="nav-av"><svg>
                        <use href="#i-user" />
                    </svg></span><b id="nk"></b></button>
            <nav>
                <button data-v="home"><svg>
                        <use href="#i-home" />
                    </svg><span data-i="home"></span></button>
                <button data-v="favs"><svg>
                        <use href="#i-heart" />
                    </svg><span data-i="fav"></span></button>
                <button data-v="pls"><svg>
                        <use href="#i-list" />
                    </svg><span data-i="pls"></span></button>
                <button data-v="arch"><svg>
                        <use href="#i-clock" />
                    </svg><span data-i="arch"></span></button>
            </nav>
        </aside>
        <main>
            <header>
                <div class="m-top">
                    <div class="logo"><svg>
                            <use href="#i-logo" />
                        </svg><span>MegaMusic</span></div>
                    <div class="h-acts">
                        <div class="lang-bar">
                            <button data-gl="uz">UZ</button>
                            <button data-gl="en">EN</button>
                            <button data-gl="ru">RU</button>
                        </div>
                        <button id="th" class="ib" title="Dark / Light"><svg>
                                <use href="#i-sun" />
                            </svg></button>
                        <button id="go-auth" class="ib" title="Account / Register"><svg>
                                <use href="#i-user" />
                            </svg></button>
                    </div>
                </div>
                <div class="h-row">
                    <form id="sf"><svg>
                            <use href="#i-search" />
                        </svg><input id="q" autocomplete="off"></form>
                    <div class="h-acts d-only">
                        <div class="lang-bar">
                            <button data-gl="uz">UZ</button>
                            <button data-gl="en">EN</button>
                            <button data-gl="ru">RU</button>
                        </div>
                        <button id="th-d" class="ib" title="Dark / Light"><svg>
                                <use href="#i-sun" />
                            </svg></button>
                        <button id="go-auth-d" class="ib" title="Account / Register"><svg>
                                <use href="#i-user" />
                            </svg></button>
                    </div>
                </div>
            </header>
            <section id="view"></section>
        </main>
    </div>

    <div id="mini" hidden>
        <img id="mi" alt="">
        <div class="mt" id="mo"><b id="mti"></b><small id="mar"></small></div>
        <button class="ib" id="mrp" title="Repeat"><svg>
                <use href="#i-repeat" />
            </svg></button>
        <button class="ib hb" id="mh"><svg>
                <use href="#i-heart" />
            </svg></button>
        <button class="ib pp" id="mp"><svg>
                <use href="#i-pause" />
            </svg></button>
        <button class="ib" id="mx"><svg>
                <use href="#i-x" />
            </svg></button>
        <button class="ib" id="mu"><svg>
                <use href="#i-up" />
            </svg></button>
        <i id="mpg"></i>
    </div>

    <div id="full">
        <div id="fbg"><img alt=""></div>
        <div class="ftop">
            <button class="ib" id="fb"><svg>
                    <use href="#i-down" />
                </svg></button>
            <button class="ib" id="fpl-add" title="Add to playlist"><svg>
                    <use href="#i-plus" />
                </svg></button>
        </div>
        <img id="fi" alt="">
        <h2 id="fti"></h2>
        <p id="far"></p>
        <div class="seek"><small id="tc">0:00</small><input type="range" id="sk" min="0" max="100" step=".1"
                value="0"><small id="td">0:00</small></div>
        <div class="ctl">
            <button class="ib" id="b10"><svg>
                    <use href="#i-b10" />
                </svg></button>
            <button class="ib" id="pv"><svg>
                    <use href="#i-prev" />
                </svg></button>
            <button class="ib big pp" id="fp"><svg>
                    <use href="#i-pause" />
                </svg></button>
            <button class="ib" id="nx"><svg>
                    <use href="#i-next" />
                </svg></button>
            <button class="ib" id="f10"><svg>
                    <use href="#i-f10" />
                </svg></button>
        </div>
        <div class="vr">
            <button class="ib" id="frp" title="Repeat"><svg>
                    <use href="#i-repeat" />
                </svg></button>
            <button class="ib hb" id="fh"><svg>
                    <use href="#i-heart" />
                </svg></button>
            <svg class="vi">
                <use href="#i-vol" />
            </svg><input type="range" id="vl" min="0" max="1" step=".01" value=".8">
        </div>
    </div>

    <div id="modal" hidden>
        <div class="mbox" id="mbody"></div>
    </div>
    <div id="toast"></div>

    <audio id="au" preload="auto"></audio>
    <script src="app.js"></script>
</body>

</html>
